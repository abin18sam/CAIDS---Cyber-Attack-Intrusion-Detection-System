# CAIDS Data Collection - collector.conf
# Lines starting with # are comments. key = value, one per line.

# --- Capture source ---
interface = eth0
bpf_filter = ip
snaplen = 65535
promiscuous = true
read_timeout_ms = 1000

# --- Output locations ---
output_dir = /var/lib/caids/captures
log_dir = /var/log/caids

# --- Rotation (whichever limit hits first triggers a new file) ---
rotate_seconds = 3600
rotate_max_bytes = 524288000

# --- What to write ---
write_raw_pcap = true
write_metadata_log = true

# --- Health / resilience ---
stats_interval_seconds = 60
min_free_disk_percent = 10
reconnect_backoff_start_seconds = 2
reconnect_backoff_max_seconds = 60
